    <h1>常见的矿石有哪些，它们的选别方法是什么？</h1>
    <div class="post-meta">2026年7月</div>
  </article>
  <div class="post-content">
<p>各种矿石的矿物成分比较复杂。但常见的矿石种类其实不多。</p>

<h2>常见矿石类型</h2>

<ul>
  <li>铁矿石：磁铁矿、赤铁矿、褐铁矿</li>
  <li>铜矿石：黄铜矿、斑铜矿、辉铜矿</li>
  <li>金矿石：自然金、含金硫化物、氧化金矿</li>
</ul>

<h2>不同矿石的选别特点</h2>

<p>磁铁矿以磁选为主，流程简单；赤铁矿弱磁性，用重选或反浮选；黄铜矿以浮选为主。</p>

<p>认清矿石类型是做好选矿试验的第一步。</p>
