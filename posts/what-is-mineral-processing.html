  <div class="post-content">
<p>在选矿学习过程中，你可能会遇到这个问题：选矿到底是什么？</p>

<blockquote><p>选矿是把有用矿物从矿石中分离出来的过程。</p></blockquote>

<h2>选矿的基本流程</h2>

<ul>
  <li>破碎磨矿：把大块矿石弄碎，让有用矿物解离。</li>
  <li>选别作业：重选、浮选、磁选等方法。</li>
  <li>产品处理：精矿脱水和尾矿处置。</li>
</ul>

<p>选矿流程中的每一个环节都有它独特的意义。后续慢慢展开讲。</p>
